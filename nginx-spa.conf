server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers texte
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Routes Angular (SPA) : tout renvoie vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers avec hash dans le nom
    location ~* \.(js|css|svg|ico|png|jpg|jpeg|webp|woff2?|gif|pdf|json)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}