server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers texte
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les appels /api sont transmis au backend Spring Boot (reseau Docker interne).
    # "backend" = nom du service dans le docker-compose ; port 8082 interne.
    location /api/ {
        proxy_pass http://backend:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routes Angular (SPA) : tout le reste renvoie vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers avec hash dans le nom
    location ~* \.(js|css|svg|ico|png|jpg|jpeg|webp|woff2?|gif|pdf|json)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}